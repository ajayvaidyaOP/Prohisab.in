spring:
  datasource:
    url: jdbc:h2:mem:depositin_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cookie:
    secure: false
    same-site: lax
  timezone: Asia/Kolkata
  login-rate-limit:
    max-failed-attempts: 10
    window-minutes: 15
  trust-proxy: true

logging:
  level:
    org.hibernate.SQL: warn
    org.flywaydb: warn

# Deterministic seed for tests
ADMIN_NAME: admin
ADMIN_PASSWORD: AdminPass123
