spring:
  application:
    name: depositin-erp
  profiles:
    default: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/depositin_erp?useSSL=true&requireSSL=false&serverTimezone=UTC&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USER:depositin}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      pool-name: depositin-pool
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-migration-naming: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:4000}
  forward-headers-strategy: framework
  error:
    include-message: never

# Application-specific settings (see config/AppProperties.java)
app:
  # Session cookie name and lifetime
  session:
    cookie-name: erp_session
    idle-timeout-minutes: ${SESSION_IDLE_MINUTES:120}
    max-hours: ${SESSION_MAX_HOURS:12}
  # Cookie flags. Production (behind Nginx + HTTPS) must set COOKIE_SECURE=true.
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:lax}
  # Business time zone used for "today" and date validation (Asia/Kolkata).
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  # Login brute-force protection: max failed attempts per name+IP in the window.
  login-rate-limit:
    max-failed-attempts: 10
    window-minutes: 15
  # Set to true when running behind Nginx so X-Forwarded-* headers are honoured.
  trust-proxy: ${TRUST_PROXY:true}
  # Allowed write origins (CSRF origin check). Empty = same host as the request.
  allowed-origins: ${ALLOWED_ORIGINS:}

---
# Development / demo profile: H2 in MySQL compatibility mode (no MySQL needed).
# Production MUST use the default "prod" profile with MySQL 8.
spring:
  config:
    activate:
      on-profile: dev-h2
  datasource:
    url: jdbc:h2:mem:depositin;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  cookie:
    secure: false
  login-rate-limit:
    max-failed-attempts: 50

---
# ---------------------------------------------------------------
# dev-h2: zero-dependency demo mode. Build with -Pdemo-h2 so the H2
# driver is on the classpath, then run with --spring.profiles.active=dev-h2.
# Everything lives in memory - perfect for demos and previews.
# ---------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev-h2
  datasource:
    url: jdbc:h2:mem:depositin_demo;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
